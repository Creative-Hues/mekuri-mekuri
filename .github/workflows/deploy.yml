# main に push したら、ビルドして GitHub Pages に公開する
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  # GitHub の画面(Actions タブ)から手動でも実行できるようにする
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったときは、新しいほうを優先する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: ライブラリを入れる
        run: npm ci

      # テストが失敗したらここで止まり、公開(deploy)へは進まない
      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v5
