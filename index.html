<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="めくりめくり" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>めくりめくり</title>
    <meta name="description" content="シンプルでデザイン性の高いノートアプリ。ページを左右にめくって書き、表紙や紙の色を選べます。ノートは端末の中だけに保存します。" />
    <!-- SNS などで共有したときの表示(OGP)。画像はアプリのアイコン -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="めくりめくり" />
    <meta property="og:title" content="めくりめくり" />
    <meta property="og:description" content="シンプルでデザイン性の高いノートアプリ。ノートは端末の中だけに保存します。" />
    <meta property="og:url" content="https://creative-hues.github.io/mekuri-mekuri/" />
    <meta property="og:image" content="https://creative-hues.github.io/mekuri-mekuri/pwa-512x512.png" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary" />
    <script>
      // ダークモード:画面が一瞬白くならないよう、描画の前にテーマを決める(src/theme/theme.ts と同じ判定)
      try {
        var p = localStorage.getItem('mekuri-theme')
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
